name: Validate robot firmware
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.4.1'
      - name: Install pinned board core
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.10 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Test control logic and Python producer expiry
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/test_control.cpp -o /tmp/test-control
          /tmp/test-control
          python -m unittest discover -s tests -p 'test_client.py' -v
          python -m unittest discover -s tests -p 'test_network_policy.py' -v
      - name: Test dashboard in Chromium
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python tests/test_dashboard.py
      - name: Compile ESP32-S3 N16R8 and verify OTA slots
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: robot-controller-build
          path: build/*.bin
